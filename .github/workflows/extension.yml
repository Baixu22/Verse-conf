name: VSCode distribution retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Distribution is frozen
    runs-on: ubuntu-latest
    steps:
      - name: Report retirement
        run: printf '%s\n' 'VSCode and LSP distribution builds stopped on 2026-09-28. See docs/CLOSEOUT.md. This workflow builds and uploads no artifacts.'

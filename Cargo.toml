[workspace]
members = [
    "crates/verseconf-core",
    "crates/verseconf-cli",
    "crates/verseconf-test",
    "crates/verseconf-lsp",
    "crates/verseconf-mcp",
    "crates/verseconf-bench",
    "crates/verseconf-toml",
    "crates/verseconf-json",
    "compare",
    "integrations/verseconf-wasm",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["VerseConf Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Baixu22/Verse-conf"
description = "A modern configuration language implementation in Rust based on VerseConf v1.1 spec"

[workspace.dependencies]
# Core dependencies
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
chrono = "0.4"
regex = "1.10"
atty = "0.2"
toml = "0.8"
toml_edit = "0.22"
serde_json = "1.0"
notify = "6.1"
# JSON/JSONC 适配层：解析、注释、键序与位置区间都交给成熟实现，不自写解析器。
# `cst` 打开后可变更的 CST（保真编辑用）；`serde_json` 打开后 AST 可直接转成
# `serde_json::Value`（标准 JSON Schema 校验需要它当实例）。
jsonc-parser = { version = "0.32", features = ["cst", "serde_json"] }
# 标准 JSON Schema 校验（TF-0092）：draft-07 与 2020-12 由成熟实现负责。
#
# 两个默认 feature 都关掉：`resolve-http` 会把 reqwest 与 tokio 拖进依赖树，
# 而 `resolve-file` 在 wasm32 上是**明确不支持**的（上游直接 compile_error）。
# 关掉之后，跨文件 `$ref` 的抓取由调用方负责——本层的 `$schema` 解析本来就是
# 自己读文件、把文本交给校验器，所以不需要上游的文件解析能力。
jsonschema = { version = "0.33", default-features = false }

# CLI dependencies
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"

# Dev dependencies
rstest = "0.18"
criterion = "0.5"
insta = "1.34"

# wasm 分发希望产物更小。profile 只能在作为工作区根的这个文件里声明：
# 写在 integrations/verseconf-wasm/Cargo.toml 里的 [profile.release] 会被 cargo
# 忽略（"profiles for the non root package will be ignored"），此前那条设置
# 实际上从未生效。lto 不能按 package 覆盖，所以只覆盖 opt-level。
[profile.release.package.verseconf-wasm]
opt-level = "s"
